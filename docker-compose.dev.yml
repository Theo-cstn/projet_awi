services:
  db:
    image: postgres:16-alpine
    container_name: festival_app_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-festival_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-festival_app}
      POSTGRES_DB: ${POSTGRES_DB:-festival_app}
    volumes:
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app_net

  adminer:
    image: adminer:latest
    container_name: festival_app_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db
    networks:
      - app_net

volumes:
  db_data:

networks:
  app_net: