<div class="form-container">
  <h2>{{ festivalAEditer() ? 'Modifier le festival' : 'Ajouter un Festival' }}</h2>
  
  <form [formGroup]="form" (ngSubmit)="onSubmitForm()">
      <input type="text" id="nom" formControlName="nom" placeholder="Nom du festival">
      <div class="date-group">
          <label>Du :</label>
          <input type="date" id="date_debut" formControlName="date_debut">
          <label>Au :</label>
          <input type="date" id="date_fin" formControlName="date_fin">
      </div>
      <input type="number" id="nbTablesPetites" formControlName="nbTablesPetites" min="0">
      <input type="number" id="nbTablesGrandes" formControlName="nbTablesGrandes" min="0">
      <input type="number" id="nbTablesMairie" formControlName="nbTablesMairie" min="0">

    <div class="zones-section">
      <h3>Zones Tarifaires</h3>
      <app-zone-tarifaire-form 
        [zoneAEditer]="zoneEnEdition()"
        (add)="onAddZone($event)"
        (update)="onUpdateZone($event)"
        (cancel)="zoneEnEdition.set(undefined)">
      </app-zone-tarifaire-form>

      @if (zonesTarifaires().length > 0){
        <h4>Zones ajoutées :</h4>
        @for (zone of zonesTarifaires(); track zone.id!){
          <app-zone-tarifaire-component
            [zoneT]="zone"
            [canEdit]="true"
            [canDelete]="true"
            (edit)="onEditZone($event)"
            (remove)="onRemoveZone($event)">
          </app-zone-tarifaire-component>
        }
      }
      @else if (zonesTarifaires().length === 0){
        <em class="empty-message">Aucune zone tarifaire ajoutée</em>
      }

    <button type="submit" [disabled]="form.invalid || zonesTarifaires().length === 0" class="btn-submit">
      {{ festivalAEditer() ? 'Modifier le Festival' : 'Ajouter le Festival' }}
    </button>
    </div>
  </form>
</div>
