<div class="header-section">
  <h1>Gestion des Festivals</h1>
  <h4 class="count">Nombre de festivals : {{ nbFestival() }}</h4>

  @if (showForm) {
    <div class="form-container">
      <app-festival-form (add)="onAdd($event)"></app-festival-form>
      <button class="btn-cancel" (click)="showForm = false">Annuler</button>
    </div>
  } @else {
    <button class="btn-primary" (click)="add()">+ Ajouter un Festival</button>
  }
</div>

<div class="festival-grid">
  @for (f of festivals(); track f.id) {
    <app-festival-component 
        [festival]="f" 
        (click)="openWorkspace(f.id!)">
    </app-festival-component>
  }
</div>

@if (festivals().length === 0 && !showForm) {
  <div class="empty-state">
    <p>Aucun festival enregistré. Cliquez sur "Ajouter un Festival" pour commencer.</p>
  </div>
}
