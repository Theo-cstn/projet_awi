@if (editeurId()) {
<h1>Contact de {{ editeur()?.nom ?? '...' }}</h1>
<button (click)="retourEditeurs()" class="link-back">
← Retour aux éditeurs
</button>
} @else {
<h1>Liste des Contacts</h1>
}

<button (click)="toggleFormulaire()">
    {{ afficherFormulaire() ? 'Annuler' : 'Ajouter un contact' }}
</button>

@if (afficherFormulaire()) {
    <app-contact-form
        [editeurId]="editeurId()"
        [contactAEditer]="contactEnEdition()"
        (add)="onAdd($event)"
        (update)="onUpdate($event)">
    </app-contact-form>
}

@if (contacts().length > 0) {
    @for (contact of contacts(); track contact.id) {
        <app-contact-component
            [contact]="contact"
            [canEdit]="true"
            (edit)="onEdit($event)"
            (delete)="onDeleteContact($event)"> </app-contact-component>
    }
} @else {
    <p>Aucun contact</p>
}
