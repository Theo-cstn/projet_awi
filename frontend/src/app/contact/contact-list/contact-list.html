<button (click)="toggleFormulaire()">
    {{ afficherFormulaire() ? 'Annuler' : 'Ajouter un contact' }}
</button>

@if (afficherFormulaire()) {
    <app-contact-form
        [editeurId]="editeurId()"
        (add)="onAdd($event)">
    </app-contact-form>
}

@if (contacts().length > 0) {
    @for (contact of contacts(); track contact.id) {
        <app-contact-component
            [contact]="contact">
        </app-contact-component>
    }
} @else {
    <p>Aucun contact</p>
}
