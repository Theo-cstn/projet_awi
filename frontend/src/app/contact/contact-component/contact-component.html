<div class="card">
    <h2>{{ this.contact().nom }} {{ this.contact().prenom }}</h2>
    <div class="info">
        <p>
            <strong>Email :</strong> {{ this.contact().email }}
        </p>
        @if(contact().poste) {
            <p><strong>Poste :</strong> {{ contact().poste }}</p>
        }
    </div>

    @if (canEdit()) {
        <div class="actions">
            <button class="btn" (click)="onEdit()">Éditer</button>
            <button class="btn" (click)="onDelete()">Supprimer</button>
        </div>
    }
</div>
