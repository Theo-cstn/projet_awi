<div style="margin:.5rem 0;">
    <form [formGroup]="form" (ngSubmit)="onSubmitForm()">

    <input type="text" formControlName="nom" placeholder="nom">
    <div>
        <label>Nombre de tables (unité d'espace): </label>
        <input type="number" formControlName="nbTables" placeholder="nombre de tables">
    </div>

    <button type="submit" [disabled]="form.invalid">Ajouter une zone plan</button>
    </form>
</div>
