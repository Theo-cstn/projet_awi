<div style="margin:.5rem 0;">

    <form [formGroup]="form" (ngSubmit)="onSubmitForm()">
        <div>
            <input type="text" formControlName="nom" placeholder="nom">
        </div>
        <div>
            <label>Nombre de tables totales: </label>
            <input type="number" formControlName="nbTotalTables" placeholder="nombre total de tables">
        </div>

        <div>
            <label>Prix d'une table: </label>
            <input type="number" formControlName="prixTable" placeholder="Prix d'une table">
        </div>
        
        <div>
            <label>Prix d'un m^2:</label>
            <input type="number" formControlName="prixM" placeholder="Prix au m^2">
        </div>

        <div class="zone-selection">
            <h3>Zones Plans</h3>
            <app-zone-plan-form (add)="onAddZone($event)"></app-zone-plan-form>

            @if (zonesPlan().length > 0){
                <h4>Zones ajoutées :</h4>
                @for (zone of zonesPlan(); track zone.id!){
                    <div class="zone-item">
                        <span>{{ zone.nom }} - {{ zone.nbTables }} tables</span>
                        <button type="button" (click)="onRemoveZone(zone.id!)">Supprimer</button>
                    </div>
                }
            }
            @else if (zonesPlan().length === 0){
                <em class="empty-message">Aucune zone plan ajoutée</em>
            }
        </div>

        <button type="submit" [disabled]="form.invalid || zonesPlan().length === 0">Ajouter une zone tarifaire</button>
    </form>
</div>
