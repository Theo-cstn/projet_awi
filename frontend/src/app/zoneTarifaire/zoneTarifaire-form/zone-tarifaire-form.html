<div style="margin:.5rem 0;">

    <form [formGroup]="form" (ngSubmit)="onSubmitForm()">
        <div>
            <label for="nom">Nom de la zone tarifaire</label>
            <input type="text" id="nom" formControlName="nom" placeholder="nom de la zone tarifaire">
        </div>

        <div style="padding: 0.75rem; background-color: #f0f0f0; border-radius: 4px; margin: 1rem 0;">
            <strong>Nombre de tables totales: </strong>
            <span style="font-size: 1.2rem; font-weight: bold; color: #2563eb;">{{ nbTotalTables() }}</span>
        </div>

        <div>
            <label for="prixTable">Prix d'une table</label>
            <input type="number" id="prixTable" formControlName="prixTable" placeholder="Prix d'une table en €">
        </div>
        
        <div>
            <label for="prixM">Prix d'un m²</label>
            <input type="number" id="prixM" formControlName="prixM" placeholder="Prix au m² en €">
        </div>

        <div class="zone-selection">
            <h3>Zones Plans</h3>
            <app-zone-plan-form (add)="onAddZone($event)"></app-zone-plan-form>

            @if (zonesPlan().length > 0){
                <h4>Zones plans ajoutées</h4>
                @for (zone of zonesPlan(); track zone.id!){
                    <div class="zone-item">
                        <div>
                          <strong>{{ zone.nom }}</strong>
                          <br>
                          <small>{{ zone.nbTables }} table(s)</small>
                        </div>
                        <button type="button" class="danger" (click)="onRemoveZone(zone.id!)">Supprimer</button>
                    </div>
                }
            }
            @else if (zonesPlan().length === 0){
                <em class="empty-message">Aucune zone plan ajoutée</em>
            }
        </div>

        <button type="submit" [disabled]="form.invalid || zonesPlan().length === 0">➕ Ajouter une zone tarifaire</button>
    </form>
</div>
