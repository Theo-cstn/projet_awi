<div class="card">
  <h2>{{ editeur().nom }}</h2>
  
  @if (canEdit()) {
    <button class="btn-edit" (click)="onEdit()">Éditer</button>
  }

  <div class="contacts">
    <h3>
      Contacts
      <button (click)="toggleContacts($event)">
        {{ showContacts() ? '▲' : '▼' }}
      </button>
    </h3>

    @if (showContacts()) {
      @for (c of editeur().contacts; track c.id) {
        <div class="contact">
          {{ c.nom }} {{ c.prenom }} <br>
          <small>{{ c.email }}</small>
        </div>
      } @empty {
        <p>Aucun contact</p>
      }
    }
  </div>

  <div style="margin-top: 15px;">
    <a [routerLink]="['/editeurs', editeur().id, 'jeux']" (click)="$event.stopPropagation()">
      Voir les jeux
    </a>
  </div>
</div>
