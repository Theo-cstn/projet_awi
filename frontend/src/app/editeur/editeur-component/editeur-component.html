<div class="card">
  <h2>{{ editeur().nom }}</h2>

  <div class="contacts">
    <h3>
      Contacts
      <button (click)="toggleContacts($event)">
        {{ showContacts() ? '▲' : '▼' }}
      </button>
    </h3>

    @if (showContacts()) {
      <app-contact-list 
        [editeurId]="editeur().id">
      </app-contact-list>
    }
  </div>

  <div style="margin-top: 15px;">
    <a [routerLink]="['/editeurs', editeur().id, 'jeux']" (click)="$event.stopPropagation()">
      Voir les jeux
    </a>
  </div>
</div>
