<div class="card">
  <h2>{{ editeur().nom }}</h2>
  
  @if (canEdit()) {
    <button class="btn-edit" (click)="onEdit()">Éditer</button>
  }

  <div class="links">
    <a [routerLink]="['/editeurs', editeur().id, 'jeux']" (click)="$event.stopPropagation()">
      Voir les jeux
    </a>
    <a [routerLink]="['/editeurs', editeur().id, 'contacts']" (click)="$event.stopPropagation()">
      Gérer les contacts
    </a>
  </div>
</div>
