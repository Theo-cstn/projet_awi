<div class="reservation-card">
  <div class="card-header">
    <h3>{{ nomReservant() }}</h3>
    
    <select 
      class="status-select {{ reservation().statut ?? 'PRESENT' }}"
      [value]="reservation().statut ?? 'PRESENT'" 
      (change)="onStatusChange($event)">
      
      <option value="PRESENT">PRÉSENT</option>
      <option value="FACTUREE">FACTURÉE</option>
      <option value="PAYEE">PAYÉE</option>
    </select>
  </div>

  <div class="card-body">
    <p><strong>Type :</strong> {{ reservation().type }}</p>
    <p><strong>Prises :</strong> {{ reservation().nombre_prises }}</p>
    <p><strong>Tables :</strong> {{ totalTables() }}</p>

    <p class="total-row">
      <strong>Total :</strong> 
      <span class="highlight">{{ totalPrix() }} €</span>
    </p>
  </div>

  <div class="card-actions">
    <button class="btn-edit" (click)="onEdit($event)">
      Modifier
    </button>
    <button class="btn-delete" (click)="onRemove($event)">
      Supprimer
    </button>
  </div>
</div>
