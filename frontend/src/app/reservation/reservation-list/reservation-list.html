<div class="reservation-list">

  <h2>Réservations du festival</h2>

  <button class="add-btn" (click)="addReservation()">
     Ajouter une réservation
  </button>

  @if (reservations().length === 0) {
    <p>Aucune réservation pour le moment.</p>
  }

  <div class="cards">
    @for (r of reservations(); track r.id) {
      <app-reservation-component
        [reservation]="r"
        (click)="openReservation(r.id!)">
      </app-reservation-component>
    }
  </div>
</div>
